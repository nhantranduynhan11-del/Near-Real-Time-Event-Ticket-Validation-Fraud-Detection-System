<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket Control</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1c2430; --muted: #6b7686; --line: #e3e7ee;
    --ok: #1a9d55; --down: #d93b3b; --unknown: #9aa4b2;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12161c; --card: #1b212b; --text: #e8ecf2; --muted: #93a0b2; --line: #2a3340; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
  .row + .row { border-top: 1px solid var(--line); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--unknown); flex: none; }
  .ok .dot { background: var(--ok); }
  .down .dot { background: var(--down); }
  .name { font-weight: 600; }
  .note { color: var(--muted); font-size: 13px; }
  .state { margin-left: auto; font-size: 13px; color: var(--muted); }
  .ok .state { color: var(--ok); }
  .down .state { color: var(--down); }
  .foot { display: flex; align-items: center; gap: 12px; margin-top: 14px; color: var(--muted); font-size: 13px; }
  button { font: inherit; padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px;
           background: var(--card); color: var(--text); cursor: pointer; }
  button:hover { border-color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Ticket Control</h1>
  <p class="sub">Trạng thái các phần của hệ thống</p>

  <div class="card" id="list" aria-live="polite"></div>

  <div class="foot">
    <button id="refresh" type="button">Kiểm tra lại</button>
    <span id="when">Chưa kiểm tra</span>
  </div>
</main>

<script>
(function () {
  var INTERVAL_MS = 5000;

  // Các phần hiện trên trang. keys = tên trường /api/health có thể dùng.
  var PARTS = [
    { id: 'api',  name: 'API',        note: 'Express, cổng 3000' },
    { id: 'sql',  name: 'SQL Server', note: 'cổng 1433', keys: ['sqlserver', 'sql_server', 'sql', 'database', 'db'] },
    { id: 'kafka', name: 'Kafka',     note: 'chế độ app không bật Kafka', keys: ['kafka'] }
  ];

  // true / "up" / "ok" / "connected" / {status:"up"} / {ok:true} -> 'ok'; ngược lại -> 'down'
  function toState(v) {
    if (v === true) return 'ok';
    if (v === false) return 'down';
    if (typeof v === 'string') {
      return /^(up|ok|connected|healthy|ready|true)$/i.test(v) ? 'ok' : 'down';
    }
    if (v && typeof v === 'object') {
      if ('connected' in v) return toState(v.connected);
      if ('ok' in v) return toState(v.ok);
      if ('status' in v) return toState(v.status);
    }
    return 'unknown';
  }

  function pick(data, keys) {
    var scopes = [data, data && data.services, data && data.checks, data && data.dependencies];
    for (var i = 0; i < scopes.length; i++) {
      var s = scopes[i];
      if (!s || typeof s !== 'object') continue;
      for (var j = 0; j < keys.length; j++) {
        if (keys[j] in s) return s[keys[j]];
      }
    }
    return undefined;
  }

  var LABEL = { ok: 'Đang chạy', down: 'Không kết nối', unknown: 'Chưa rõ' };

  function render(states) {
    var list = document.getElementById('list');
    list.textContent = '';
    PARTS.forEach(function (p) {
      var st = states[p.id] || 'unknown';
      var row = document.createElement('div');
      row.className = 'row ' + st;

      var dot = document.createElement('span'); dot.className = 'dot';
      var box = document.createElement('div');
      var name = document.createElement('div'); name.className = 'name'; name.textContent = p.name;
      var note = document.createElement('div'); note.className = 'note'; note.textContent = p.note;
      box.appendChild(name); box.appendChild(note);
      var state = document.createElement('span'); state.className = 'state'; state.textContent = LABEL[st];

      row.appendChild(dot); row.appendChild(box); row.appendChild(state);
      list.appendChild(row);
    });
  }

  function stamp() {
    document.getElementById('when').textContent =
      'Cập nhật lúc ' + new Date().toLocaleTimeString('vi-VN');
  }

  function check() {
    var ctl = new AbortController();
    var timer = setTimeout(function () { ctl.abort(); }, 4000);

    fetch('/api/health', { cache: 'no-store', signal: ctl.signal })
      .then(function (res) {
        // Một số API trả 503 kèm JSON chi tiết, vẫn đọc để biết phần nào hỏng
        return res.json().catch(function () { return null; }).then(function (data) {
          return { httpOk: res.ok, data: data };
        });
      })
      .then(function (r) {
        var states = { api: 'ok' };            // gọi được là API đang chạy
        PARTS.forEach(function (p) {
          if (!p.keys) return;
          states[p.id] = r.data ? toState(pick(r.data, p.keys)) : 'unknown';
        });
        render(states);
      })
      .catch(function () {
        render({ api: 'down', sql: 'unknown', kafka: 'unknown' });
      })
      .then(function () { clearTimeout(timer); stamp(); });
  }

  document.getElementById('refresh').addEventListener('click', check);
  check();
  setInterval(check, INTERVAL_MS);
})();
</script>
</body>
</html>
