<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập — Ticket Control</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body class="login-page">
<main class="login-wrap">
  <div class="login-brand">
    <h1>Ticket Control</h1>
    <p class="sub">Đăng nhập để soát vé</p>
  </div>

  <form class="card login-card" id="login-form" novalidate>
    <label class="field">
      <span>Tên đăng nhập</span>
      <input type="text" id="username" name="username" autocomplete="username"
             autocapitalize="none" spellcheck="false" required>
    </label>
    <label class="field">
      <span>Mật khẩu</span>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </label>

    <p class="form-error" id="form-error" role="alert" hidden></p>

    <button type="submit" class="btn btn-primary" id="submit" style="width:100%">Đăng nhập</button>

    <div class="mock-badge" id="mock-badge" hidden>Đang dùng dữ liệu giả (API đăng nhập chưa sẵn sàng)</div>
  </form>

  <p class="hint">
    Tài khoản demo: <code>op_gate_a</code> hoặc <code>supervisor</code> · mật khẩu <code>Demo@123</code>
  </p>
</main>

<script src="js/auth.js"></script>
<script>
(function () {
  'use strict';

  // Đã có phiên hợp lệ thì vào thẳng màn hình chính.
  if (TicketAuth.hasValidSession()) {
    location.replace('app.html');
    return;
  }

  var form = document.getElementById('login-form');
  var userEl = document.getElementById('username');
  var passEl = document.getElementById('password');
  var errEl = document.getElementById('form-error');
  var badge = document.getElementById('mock-badge');
  var submitBtn = document.getElementById('submit');

  var ERROR_TEXT = {
    INVALID_CREDENTIALS: 'Sai tên đăng nhập hoặc mật khẩu.',
    VALIDATION_ERROR: 'Vui lòng nhập đủ tên đăng nhập và mật khẩu.'
  };

  function showError(msg) {
    errEl.textContent = msg;
    errEl.hidden = false;
  }
  function clearError() {
    errEl.textContent = '';
    errEl.hidden = true;
  }

  form.addEventListener('submit', async function (ev) {
    ev.preventDefault();
    clearError();
    badge.hidden = true;

    var username = userEl.value.trim();
    var password = passEl.value;

    if (!username || !password) {
      showError('Vui lòng nhập đủ tên đăng nhập và mật khẩu.');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Đang đăng nhập…';

    try {
      var r = await TicketAuth.login(username, password);
      if (r.ok) {
        TicketAuth.saveSession(r.session);
        location.replace('app.html');
        return;
      }
      showError(ERROR_TEXT[r.code] || 'Không đăng nhập được, vui lòng thử lại.');
      if (r.mock) badge.hidden = false;
    } catch (e) {
      showError('Không đăng nhập được, vui lòng thử lại.');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Đăng nhập';
    }
  });

  userEl.focus();
})();
</script>
</body>
</html>
